name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate (locked Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Run repository gate
        run: ./test_repo.sh --ci

  docs:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Rebuild docs artifact
        run: pixi run docs

      - name: Upload built docs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html
          if-no-files-found: error
