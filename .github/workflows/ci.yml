name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality_tests:
    name: quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Run validation
        run: |
          pixi run clean-transients
          pixi run repo-hygiene
          pixi run lint
          pixi run format-check
          pixi run markdown-check
          pixi run compile-check
          pixi run unit-tests
          pixi run clean-transients
          pixi run repo-hygiene
          pixi run git-diff-check

  docs_package:
    name: package and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Build package and documentation
        run: |
          pixi run build-import-smoke
          pixi run docs
          pixi run package-build
          pixi run package-smoke

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html
          if-no-files-found: error

  validate:
    name: validate (locked Python 3.12)
    if: ${{ always() }}
    needs: [quality_tests, docs_package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every validation job passed
        env:
          QUALITY_TESTS_RESULT: ${{ needs.quality_tests.result }}
          PACKAGE_RESULT: ${{ needs.docs_package.result }}
        run: |
          test "$QUALITY_TESTS_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
