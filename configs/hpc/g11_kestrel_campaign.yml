    authorization_root: /projects/bsm/g11_authorizations
    # Hard whole-campaign admission ceiling, including the explicitly authorized
    # 100-AU contingency above the original 25,000-AU target. The live-smoke CLI
    # separately accepts the 25,000-AU site ceiling when aus_report omits the account.
    allocation_quota: "25100"
