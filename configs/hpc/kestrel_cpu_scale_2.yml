# BSM Manuscript Pipeline — Kestrel CPU scaling validation (2-node tier)
#
# Purpose:
#   CPU-distributed validation before GPU path completion.
#   This tier is the low-stress baseline to validate SLURM-array orchestration.
#
# Typical usage on Kestrel login node:
#   pixi run bsm-hpc-submit --config configs/hpc/kestrel_cpu_scale_2.yml \
#       --stage interaction_discovery --n-shards 2 --submit

dataset:
  type: "real_full_dataset"

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 104
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 512
    max_memory_budget_mb: 200000
    enable_spill_to_disk: true

stages:
  empirical_null_screening:
    n_permutations: 101
    bh_q_threshold: 0.10
  interaction_discovery:
    n_permutations: 21
    n_tree_estimators: 100
    max_tree_depth: 3
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline", "poly", "log"]
  sparse_selection:
    n_stability_subsamples: 12
    subsample_fraction: 1.0
    lasso_alpha_percentile: 50
  final_artifacts:
    bootstrap_count: 10
    bootstrap_alpha: 0.05

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  artifact_dir: "/scratch/dhetting/bsm/artifacts/kestrel_cpu_scale_2_run"
  seed: 0
  verbose: true

distributed:
  enabled: true
  backend: slurm_array
  run_id: bsm_kestrel_cpu_scale_2
  pixi_env_path: /projects/bsm/.pixi

  slurm:
    account: bsm
    partition: shared
    walltime: "00:30:00"
    memory_gb: 240
    cpus_per_task: 104
    max_concurrent_array_tasks: 2
    log_dir: "/scratch/${USER}/bsm/bsm_kestrel_cpu_scale_2/logs"
    requeue: false
    signal_seconds_before_timeout: 60

  kestrel:
    projects_root: /projects/bsm
    pixi_cache_dir: /projects/bsm/.cache/pixi
    dask_network_interface: hsn0
    max_array_size: 11000
    debug_partition: debug
    gpu_partition: gpu-h100s
    production_partition: shared

  spill:
    scratch_root: "/scratch/${USER}/bsm"
    tmpdir_spill_enabled: false
    min_free_gb: 20.0
    spill_chunk_size_mb: 256
