# BSM Manuscript Pipeline — Kestrel lightweight 2-node smoke test
#
# Purpose:
#   End-to-end distributed workflow validation (submit/status/collect) with
#   intentionally light parameters for quick debugging iterations.
#
# Target:
#   ~30 minutes of runtime per node under normal cluster conditions
#   (queue wait time is scheduler-dependent and not included).
#
# Typical usage on Kestrel login node:
#   pixi run bsm-hpc-submit --config configs/hpc/kestrel_cpu_scale_2_smoke.yml \
#       --stage interaction_discovery --n-shards 2 --submit

dataset:
  type: "synthetic_300_sample"

algorithm:
  variance_threshold: 0.90
  retained_components: 5

runtime:
  n_jobs: 36
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 128
    max_memory_budget_mb: 64000
    enable_spill_to_disk: true

stages:
  empirical_null_screening:
    n_permutations: 12
    bh_q_threshold: 1.00
  interaction_discovery:
    n_permutations: 5
    n_tree_estimators: 5
    max_tree_depth: 3
    p_threshold: 0.10
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline", "poly", "log"]
  sparse_selection:
    n_stability_subsamples: 4
    subsample_fraction: 1.0
    lasso_alpha_percentile: 50
  final_artifacts:
    bootstrap_count: 5
    bootstrap_alpha: 0.05

validation:
  fast_mode: true
  fast_mode_overrides:
    output_cap: 120

output:
  artifact_dir: "./artifacts/kestrel_cpu_scale_2_smoke_run"
  seed: 123
  verbose: true

distributed:
  enabled: true
  backend: slurm_array
  run_id: bsm_kestrel_cpu_scale_2_smoke
  pixi_env_path: /projects/bsm/.pixi

  slurm:
    account: bsm
    partition: shared
    walltime: "00:30:00"
    memory_gb: 64
    cpus_per_task: 36
    max_concurrent_array_tasks: 2
    log_dir: "/scratch/${USER}/bsm/bsm_kestrel_cpu_scale_2_smoke/logs"
    requeue: false
    signal_seconds_before_timeout: 30

  kestrel:
    projects_root: /projects/bsm
    pixi_cache_dir: /projects/bsm/.cache/pixi
    dask_network_interface: hsn0
    max_array_size: 11000
    debug_partition: debug
    gpu_partition: gpu-h100s
    production_partition: shared

  spill:
    scratch_root: "/scratch/${USER}/bsm"
    tmpdir_spill_enabled: false
    min_free_gb: 5.0
    spill_chunk_size_mb: 64
