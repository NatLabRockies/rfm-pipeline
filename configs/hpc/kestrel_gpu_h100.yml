# BSM Manuscript Pipeline — NREL Kestrel H100 GPU Configuration
# Use this config for GPU-accelerated interaction discovery on Kestrel gpu-h100s partition.
#
# Prerequisites:
#   1. Pixi environment initialized on shared filesystem:
#      cd /projects/bsm/<repo> && pixi install --locked
#   2. Data on Kestrel:
#      /projects/bsm/<repo>/artifacts/test_dataset_3k/   (or full dataset path)
#   3. Submit GPU job from login node:
#      pixi run bsm-hpc-submit --config configs/hpc/kestrel_gpu_h100.yml \
#          --stage interaction_discovery --submit
#
# GPU resource guide:
#   gpu-h100s partition: H100 80GB SXM5 GPUs, 4 per node
#   CPU: 96 cores (AMD EPYC 9534), 768 GB RAM per node
#   Network: InfiniBand HDR (200 Gb/s per port, NUMA-aware via hsn0)
#   Max walltime: 4 hours on gpu-h100s (request only what you need)
#
# GPU acceleration targets:
#   - interaction_discovery: XGBoost (device=cuda) + SHAP GPU backend
#   - Expected speedup: 10-50x vs CPU for large feature sets
#   - Other stages are I/O or sklearn bound → use CPU config for those
#
# Workflow:
#   1. Run GPU job for interaction_discovery (this config)
#   2. Run CPU reduce job after all GPU array tasks complete
#   3. Continue with remaining stages using kestrel_30k.yml (CPU config)
#
# GPU-specific environment variables set by the sbatch template:
#   BSM_INTERACTION_DEVICE=cuda
#   BSM_XGBOOST_TREE_METHOD=hist   (GPU tree method)

dataset:
  type: "real_full_dataset"

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 1                # GPU scoring: XGBoost handles internal parallelism
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 512
    max_memory_budget_mb: 700000   # H100 nodes have 768 GB RAM; leave headroom
    enable_spill_to_disk: true

stages:
  empirical_null_screening:
    n_permutations: 101
    bh_q_threshold: 0.10
  interaction_discovery:
    n_permutations: 21
    n_tree_estimators: 100
    max_tree_depth: 3
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline", "poly", "log"]
  sparse_selection:
    n_stability_subsamples: 12
    subsample_fraction: 1.0
    lasso_alpha_percentile: 50
  final_artifacts:
    bootstrap_count: 10
    bootstrap_alpha: 0.05

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  artifact_dir: "./artifacts/kestrel_gpu_h100_run"
  seed: 0
  verbose: true

# ---------------------------------------------------------------------------
# Distributed execution settings — GPU H100 configuration
# ---------------------------------------------------------------------------
distributed:
  enabled: true
  backend: slurm_array
  run_id: bsm_kestrel_gpu_h100

  # Path to shared Pixi environment (must be accessible from all compute nodes)
  pixi_env_path: /projects/bsm/.pixi

  slurm:
    account: bsm
    partition: gpu-h100s         # H100 GPU partition on Kestrel
    walltime: "04:00:00"         # H100 max is typically 4 hours
    memory_gb: 700               # Leave headroom below 768 GB node limit
    cpus_per_task: 16            # CPUs per GPU task (feed data to GPU)
    max_concurrent_array_tasks: 10   # Limit GPU array tasks (fewer GPU nodes)
    log_dir: "/scratch/${USER}/bsm/bsm_kestrel_gpu_h100/logs"
    requeue: false
    signal_seconds_before_timeout: 60

  kestrel:
    projects_root: /projects/bsm
    pixi_cache_dir: /projects/bsm/.cache/pixi
    dask_network_interface: hsn0
    max_array_size: 11000
    debug_partition: debug
    gpu_partition: gpu-h100s
    production_partition: shared

  spill:
    scratch_root: "/scratch/${USER}/bsm"
    tmpdir_spill_enabled: true    # H100 nodes: $TMPDIR is on fast NVMe
    min_free_gb: 50.0
    spill_chunk_size_mb: 512

  gpu:
    enabled: true
    device: "cuda"
    gpu_partition: "gpu-h100s"
    gpus_per_node: 4
    cuda_module: "cuda/12.3"
    xgboost_tree_method: "hist"

  dask:
    scheduler: "slurm"
    n_workers: 10
    memory_per_worker_gb: 64
    walltime: "04:00:00"
    network_interface: "hsn0"
    dashboard_port: 8787
