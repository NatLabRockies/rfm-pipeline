# BSM Manuscript Pipeline — Publication-grade Full-Dataset Configuration
# This is the main production run targeting publication-ready results.
# Quality-first approach: conservative hyperparameters optimized for result defensibility.
#
# Key philosophy:
#   - Prioritize result quality and statistical defensibility over speed
#   - Use higher permutation counts, more estimators, more stability samples
#   - No hard compute budget cap; compute time is secondary to result reliability
#   - Include all analysis stages for comprehensive understanding
#   - Generate publication-grade tables, figures, and metadata
#
# Prerequisites:
#   1. Pixi environment on shared filesystem
#   2. Full dataset available
#   3. Submit from Kestrel login node
#
# Typical usage:
#   cd /home/dhetting/src/bsm-public-rf
#   pixi run hpc-workflow -- \
#     --config configs/hpc/kestrel_publication_full_dataset.yml \
#     --action submit

dataset:
  type: "real_full_dataset"

algorithm:
  # Conservative variance threshold — retain more features for analysis
  variance_threshold: 0.90

runtime:
  n_jobs: 104           # Full Kestrel CPU node
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 512
    max_memory_budget_mb: 200000   # ~200 GB for large Kestrel nodes
    enable_spill_to_disk: true

stages:
  # Empirical null screening: more permutations for conservative significance
  empirical_null_screening:
    n_permutations: 201              # Higher: more rigorous null distribution
    bh_q_threshold: 0.05             # Stricter: more conservative FDR control

  # Interaction discovery: more permutations + estimators for robustness
  interaction_discovery:
    n_permutations: 31               # Higher: more stable importance estimates
    n_tree_estimators: 250           # More trees: more robust RF importance
    max_tree_depth: 5                # Slightly deeper: capture more complexity
    p_threshold: 0.05                # Stricter: more conservative significance

  # Nonlinear discovery: comprehensive family exploration
  nonlinear_discovery:
    edf_threshold: 2.5               # Standard threshold
    transform_families: ["spline", "poly", "log", "sqrt", "exp"]  # More families

  # Sparse selection: high stability for feature robustness
  sparse_selection:
    n_stability_subsamples: 50       # More subsamples: more robust stability ranking
    subsample_fraction: 0.8          # 80% subsampling: balance diversity and overlap
    lasso_alpha_percentile: 40       # Slightly lower: retain more features for final model

  # Final artifacts: comprehensive bootstrap for confidence intervals
  final_artifacts:
    bootstrap_count: 100             # Many iterations: tight confidence intervals
    bootstrap_alpha: 0.05            # Standard significance level

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  artifact_dir: "/scratch/dhetting/bsm/artifacts/kestrel_publication_full_dataset_run"
  seed: 0
  verbose: true

# ---------------------------------------------------------------------------
# Distributed execution settings
# ---------------------------------------------------------------------------
distributed:
  enabled: true
  backend: slurm_array
  run_id: bsm_kestrel_publication_full

  # Path to shared Pixi environment (must be accessible from all compute nodes)
  pixi_env_path: /projects/bsm/.pixi

  slurm:
    account: bsm
    partition: shared
    walltime: "04:00:00"             # 4-hour windows per job
    memory_gb: 240                   # Leave headroom below 256 GB node limit
    cpus_per_task: 104               # Full CPU node
    max_concurrent_array_tasks: 500  # Let hundreds run concurrently
    log_dir: "/scratch/${USER}/bsm/bsm_kestrel_publication_full/logs"
    requeue: false
    signal_seconds_before_timeout: 60

  kestrel:
    projects_root: /projects/bsm
    pixi_cache_dir: /projects/bsm/.cache/pixi
    dask_network_interface: hsn0
    max_array_size: 11000
    debug_partition: debug
    gpu_partition: gpu-h100s
    production_partition: shared

  spill:
    scratch_root: "/scratch/${USER}/bsm"
    tmpdir_spill_enabled: false
    min_free_gb: 20.0
    spill_chunk_size_mb: 256
