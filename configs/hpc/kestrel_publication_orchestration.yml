# Publication-Ready Full-Dataset Study — Orchestration Configuration
# Specifies HPC cluster, execution strategy, and dataset sync for publication-grade run
#
# Usage:
#   pixi run hpc-workflow -- \
#     --config configs/hpc/kestrel_publication_orchestration.yml \
#     --action submit

hpc_workflow:
  cluster:
    host: kl1.hpc.nrel.gov
    user: "${USER}"
    account: bsm

  paths:
    remote_repo_root: /home/dhetting/src/bsm-public-rf
    remote_artifacts_root: /scratch/${USER}/bsm/bsm-public-rf/artifacts
    remote_logs_root: /scratch/${USER}/bsm
    remote_snapshot_root: /scratch/${USER}/bsm/kestrel_hpc_snapshots
    local_bundle_dir: ./artifacts/publication_full_dataset_results

  # Execution: run full 7-stage pipeline with thousands of independent jobs
  execution:
    stage: output_conditioning          # Start from first stage (full pipeline)
    local_cores: 8
    run_diagnostic: false               # Skip diagnostic; go straight to production
    prepare_full_pipeline_artifacts: true  # Generate all 7 stages
    prepare_interaction_inputs: false
    cpu_tiers:
      - nodes: 1000                     # 1000 shards = ~1000 concurrent jobs per stage
        config_path: configs/hpc/kestrel_publication_full_dataset.yml

  gpu:
    enabled: false                      # No GPU for publication run (CPU-only analysis)

  pullback:
    mode: reporting_bundle              # Full results + metadata + figures
    keep_remote_snapshot: false
