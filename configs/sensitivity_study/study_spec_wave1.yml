# Sensitivity study — Wave 1 design.
#
# Targets completion in one 4-hour short-partition window on Kestrel
# (~2,750 configs at 300 concurrent tasks, ~4 CPUs/task, ~15–25 min/task).
#
# Supplementary waves use increments of 1000 for both seeds:
#   Wave 2: config_lhs_seed: 2000, dgp_lhs_seed: 2000
#   Wave 3: config_lhs_seed: 3000, dgp_lhs_seed: 3000
# Each wave is an independent LHS of the same design space and can be
# pooled with prior waves for meta-regression.
study:
  pure_synthetic_n_dgps: 50
  calibrated_n_dgps: 10
  n_configs_per_dgp_pure: 10
  n_configs_per_dgp_calibrated: 5
  n_replicates: 5
  config_lhs_seed: 1000
  dgp_lhs_seed: 1000

output:
  study_dir: "/path/to/your/sensitivity_study_output"  # CONFIGURE: set to your desired output directory
  n_jobs: 100

slurm:
  account: "${SLURM_ACCOUNT:-rfm}"
  partition: short
  walltime: "04:00:00"
  memory_gb: 220
  cpus_per_task: 104
  max_concurrent: 100
