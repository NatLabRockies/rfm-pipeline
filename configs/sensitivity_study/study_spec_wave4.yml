# Sensitivity study — Wave 4 (production-replica calibrated corner).
#
# Purpose: provide RF training rows at the BSM production operating point
# (strict-quality corner) so the wave123 RF prediction at the BSM feature
# vector is no longer extrapolation. Wave123 had only 20 BSM rows in this
# corner (BH q ≤ 0.05, screening perms ≥ 201, n_stab ≥ 50); wave4 adds 30.
#
# Design:
#   - calibrated_structure block only (10 LHS DGPs in d∈[100,200], n∈[5000,
#     30000], spanning the BSM production point d=135, n=28750)
#   - one config per DGP, held fixed at the production override set
#   - 3 replicates per DGP for variance estimation
#   - subsample levels = 1 (full n only) — strict-quality corner is most
#     informative at full n; partial-n rows are well-covered by waves 1-3
#   - pure_synthetic block reduced to 1×1×1 throwaway (the LHS generator
#     requires at least one row; filtered out on collect)
# Total: 10 calibrated × 1 config × 3 reps + 1 pure throwaway = 31 jobs.
#
# Production override set (matches manuscript §7.5 BSM operating point):
#   variance_threshold              = 0.90
#   empirical_null_screening
#     n_permutations                = 201
#     bh_q_threshold                = 0.05
#   interaction_discovery
#     n_permutations                = 31
#     p_threshold                   = 0.05
#   sparse_selection
#     n_stability_subsamples        = 50
#     lasso_alpha_grid_size         = 40
#   final_artifacts
#     delta_threshold_override      = 0.002
#
# Seed convention: wave N uses config_lhs_seed=N*1000, dgp_lhs_seed=N*1000.
# Wave 4 = seeds 4000.
study:
  pure_synthetic_n_dgps: 1
  calibrated_n_dgps: 10
  n_configs_per_dgp_pure: 1
  n_configs_per_dgp_calibrated: 1
  n_replicates: 3
  pure_synthetic_n_subsample_levels: 1
  calibrated_n_subsample_levels: 1
  config_lhs_seed: 4000
  dgp_lhs_seed: 4000
  fixed_overrides:
    variance_threshold: 0.90
    stages.empirical_null_screening.n_permutations: 201
    stages.empirical_null_screening.bh_q_threshold: 0.05
    stages.interaction_discovery.n_permutations: 31
    stages.interaction_discovery.p_threshold: 0.05
    stages.sparse_selection.n_stability_subsamples: 50
    stages.sparse_selection.lasso_alpha_grid_size: 40
    stages.final_artifacts.delta_threshold_override: 0.002

output:
  study_dir: "/scratch/dhetting/bsm/sensitivity_study_wave4"
  n_jobs: 31

slurm:
  account: "${SLURM_ACCOUNT:-rfm}"
  partition: shared
  walltime: "08:00:00"
  memory_gb: 220
  cpus_per_task: 104
  max_concurrent: 31
