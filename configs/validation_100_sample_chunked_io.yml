# Small test config (100 samples) for rapid out-of-core integration testing
# Features: fast execution, chunked I/O enabled, small memory budget to force spill

dataset:
  type: "synthetic_300_sample"
  # Will use only first 100 samples in manuscript stages

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: -1
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 10  # Very small chunks to test spill logic quickly
    max_memory_budget_mb: 512  # Tight budget to force spill during tests
    enable_spill_to_disk: true
  output_batch_size: null

stages:
  empirical_null_screening:
    n_permutations: 100  # Fast: ~2-3 sec
    bh_q_threshold: 0.10
  interaction_discovery:
    n_tree_estimators: 10  # Fast
    max_tree_depth: 5
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline"]
  sparse_selection:
    n_stability_subsamples: 10  # Fast
    subsample_fraction: 1.0
    lasso_alpha_percentile: 50
  final_artifacts:
    bootstrap_count: 20  # Fast
    bootstrap_alpha: 0.05

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  artifact_dir: "./artifacts/test_chunked_io_100/"
