# Fast validation run (20 resamples, reduced features, serial)
# For CI and quick pipeline smoke tests

<<: &defaults_300_sample
  dataset:
    type: "synthetic_300_sample"
  algorithm:
    variance_threshold: 0.90
  runtime:
    n_jobs: 1
  stages:
    empirical_null_screening:
      n_permutations: 5
      bh_q_threshold: 0.10
    interaction_discovery:
      n_tree_estimators: 20
      max_tree_depth: 10
    nonlinear_discovery:
      edf_threshold: 2.5
    sparse_selection:
      n_stability_subsamples: 8
      subsample_fraction: 1.0
      lasso_alpha_grid_size: 50
    final_artifacts:
      bootstrap_count: 20
      bootstrap_alpha: 0.05
  validation:
    fast_mode: false
    fast_mode_overrides:
      output_cap: 300
  output:
    artifact_dir: "./artifacts/validation_300_sample_fast/"
    seed: 123
    verbose: true
