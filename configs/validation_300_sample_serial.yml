# Serial validation run (100 resamples, full components, serial)
# For baseline comparisons and memory-constrained environments

dataset:
  type: "synthetic_300_sample"

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 1  # Serial
  output_batch_size: null

stages:
  empirical_null_screening:
    n_permutations: 1000
    bh_q_threshold: 0.10
  interaction_discovery:
    n_tree_estimators: 100
    max_tree_depth: 10
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
  sparse_selection:
    n_stability_subsamples: 100
    subsample_fraction: 1.0
    lasso_alpha_grid_size: 50
  final_artifacts:
    bootstrap_count: 200
    bootstrap_alpha: 0.05

validation:
  fast_mode: false

output:
  artifact_dir: "./artifacts/validation_300_sample_serial/"
  seed: 123
  verbose: true
