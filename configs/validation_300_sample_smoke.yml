# Capped smoke validation run (minutes-scale preflight)
# Use this before no-caps runs to verify full stage-chain health.

dataset:
  type: "synthetic_300_sample"

algorithm:
  variance_threshold: 0.90
  retained_components: 5

runtime:
  n_jobs: 1
  output_batch_size: null

stages:
  empirical_null_screening:
    n_permutations: 12
    bh_q_threshold: 1.00
  interaction_discovery:
    n_tree_estimators: 5
    max_tree_depth: 4
    p_threshold: 0.10
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline", "poly", "log"]
  sparse_selection:
    n_stability_subsamples: 4
    subsample_fraction: 1.0
    lasso_alpha_percentile: 50
  final_artifacts:
    bootstrap_count: 5
    bootstrap_alpha: 0.05

validation:
  fast_mode: true
  fast_mode_overrides:
    output_cap: 120

output:
  artifact_dir: "./artifacts/validation_300_sample_smoke/"
  seed: 123
  verbose: true
