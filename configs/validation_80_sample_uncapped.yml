dataset:
  type: "synthetic_300_sample"
  path: "artifacts/test_dataset_160"

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 1
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 16
    max_memory_budget_mb: 1024
    enable_spill_to_disk: true

stages:
  empirical_null_screening:
    n_permutations: 1000
    bh_q_threshold: 0.10
  interaction_discovery:
    n_tree_estimators: 100
    max_tree_depth: 10
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
    transform_families: ["spline", "poly", "log"]
  sparse_selection:
    n_stability_subsamples: 100
    subsample_fraction: 1.0
    lasso_alpha_grid_size: 50
  final_artifacts:
    bootstrap_count: 200
    bootstrap_alpha: 0.05

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  artifact_dir: "./artifacts/validation_160_sample_uncapped/"
  seed: 123
  verbose: true
