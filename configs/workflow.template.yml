# Copy this file and set dataset.path and output.artifact_dir.
dataset:
  type: custom
  path: /absolute/path/to/dataset

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 1
  out_of_core:
    enabled: false

stages:
  empirical_null_screening:
    n_permutations: 201
    bh_q_threshold: 0.05
  interaction_discovery:
    n_permutations: 201
    n_tree_estimators: 250
    max_tree_depth: 5
  nonlinear_discovery:
    edf_threshold: 2.5
  sparse_selection:
    n_stability_subsamples: 50
    subsample_fraction: 0.8
  final_artifacts:
    bootstrap_count: 100
    bootstrap_alpha: 0.05

output:
  artifact_dir: ./artifacts/my-workflow-run/
  seed: 123
  verbose: true
