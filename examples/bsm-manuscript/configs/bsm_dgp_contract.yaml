# BSM-only typed data-generating-process contract for Generation 11.
#
# Scientific method controls, sample sizes, replicate counts, seeds, and
# scheduler work units are deliberately absent.  They come exclusively from
# configs/g11_campaign_contract.toml, loaded and verified by rfm-pipeline.

schema_version: 1

input_schema:
  n_inputs: 160
  continuous_inputs: 158
  binary_inputs: 2
  binary_input_names:
    - FM.Use Agnostic FS Conversion
    - OI.Use AEO Reference Oil
  metadata_path: configs/manuscript_input_metadata.yml
  all_binary_cells_required: true

dgp:
  continuous_distribution: uniform_published_range
  binary_distribution: balanced_four_cell
  coded_continuous_range: [-1.0, 1.0]
  binary_coding: [-1.0, 1.0]
  intercept: 0.25
  noise_base_sd: 0.20
  row_heteroscedasticity:
    driver_input_position: 0
    minimum_multiplier: 0.75
    maximum_multiplier: 1.50
    function: bounded_affine_absolute_coded_input
  correlated_block:
    size: 6
    latent_weight: 0.70
    noise_weight: 0.30
  strong_effect_floor: 0.75
  transform_library: [quadratic, logarithm, inverse, square_root]

scenarios:
  - name: global_null
    role: "null"
    n_continuous_main: 0
    n_binary_main: 0
    interaction_kind: none
    nonlinear_kind: none
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: false
  - name: interaction_null
    role: "null"
    n_continuous_main: 4
    n_binary_main: 0
    interaction_kind: none
    nonlinear_kind: quadratic
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: false
  - name: correlated_interaction_null
    role: "null"
    n_continuous_main: 4
    n_binary_main: 0
    interaction_kind: none
    nonlinear_kind: quadratic
    snr: 10.0
    correlated_inputs: true
    heteroscedastic: false
  - name: heteroscedastic_interaction_null
    role: "null"
    n_continuous_main: 4
    n_binary_main: 0
    interaction_kind: none
    nonlinear_kind: quadratic
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: true
  - name: binary_main_interaction_null
    role: "null"
    n_continuous_main: 4
    n_binary_main: 2
    interaction_kind: none
    nonlinear_kind: quadratic
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: false
  - name: sparse_strong_hierarchical
    role: strong_alternative
    n_continuous_main: 4
    n_binary_main: 0
    interaction_kind: continuous_continuous
    nonlinear_kind: quadratic
    snr: 12.0
    correlated_inputs: false
    heteroscedastic: false
  - name: binary_continuous_strong
    role: strong_alternative
    n_continuous_main: 4
    n_binary_main: 1
    interaction_kind: binary_continuous
    nonlinear_kind: none
    snr: 12.0
    correlated_inputs: false
    heteroscedastic: false
  - name: binary_binary_strong
    role: strong_alternative
    n_continuous_main: 2
    n_binary_main: 2
    interaction_kind: binary_binary
    nonlinear_kind: none
    snr: 12.0
    correlated_inputs: false
    heteroscedastic: false
  - name: weak_signal
    role: stress
    n_continuous_main: 4
    n_binary_main: 0
    interaction_kind: continuous_continuous
    nonlinear_kind: quadratic
    snr: 3.0
    correlated_inputs: false
    heteroscedastic: false
  - name: correlated_redundant
    role: stress
    n_continuous_main: 8
    n_binary_main: 0
    interaction_kind: continuous_continuous
    nonlinear_kind: none
    snr: 8.0
    correlated_inputs: true
    heteroscedastic: false
  - name: pure_interaction
    role: stress
    n_continuous_main: 0
    n_binary_main: 0
    interaction_kind: continuous_continuous
    nonlinear_kind: none
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: false
  - name: nonlinear_misspecified
    role: stress
    n_continuous_main: 2
    n_binary_main: 0
    interaction_kind: none
    nonlinear_kind: sine
    snr: 10.0
    correlated_inputs: false
    heteroscedastic: false
