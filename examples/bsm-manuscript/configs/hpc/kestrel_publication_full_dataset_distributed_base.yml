# RETIRED/NON-EXECUTABLE: preserved only as historical configuration.
# Use the content-addressed G11 campaign package and its phase authorizations.
# Publication-grade full-dataset baseline for staged distributed HPC execution.
# CONFIGURE: set SCRATCH_DIR to your cluster scratch root.
# Example: export SCRATCH_DIR=/path/to/scratch/${USER}
#
# This file pins all manuscript-facing analysis parameters.
# Stage-specific SLURM settings (walltime/memory/cpus/concurrency/run_id/log_dir)
# are injected by scripts/kestrel/controller_publication_full_dataset_distributed.sh.

dataset:
  type: "real_full_dataset"
  path: "${SCRATCH_DIR}/bsm/bsm-public-rf/artifacts/preprocessed_real_data_30k"

algorithm:
  variance_threshold: 0.90

runtime:
  # Overridden per stage by controller.
  n_jobs: 8
  output_batch_size: null
  use_chunked_io: true
  chunked_io_config:
    chunk_size_mb: 512
    max_memory_budget_mb: 200000
    enable_spill_to_disk: true

stages:
  empirical_null_screening:
    n_permutations: 201
    bh_q_threshold: 0.05

  interaction_discovery:
    n_permutations: 500
    n_tree_estimators: 250
    max_tree_depth: 5
    p_threshold: 0.05
    parallel_batch_timeout_seconds: 0

  nonlinear_discovery:
    edf_threshold: 2.5

  sparse_selection:
    n_stability_subsamples: 50
    subsample_fraction: 0.8
    lasso_alpha_grid_size: 40

  final_artifacts:
    bootstrap_count: 100
    bootstrap_alpha: 0.05

validation:
  fast_mode: false
  fast_mode_overrides: {}

output:
  # Overridden by controller to study-scoped artifact root.
  artifact_dir: "${SCRATCH_DIR}/bsm/studies/publication_full_dataset_distributed_20260519/artifacts"
  seed: 0
  verbose: true

distributed:
  enabled: true
  backend: slurm_array
  # Overridden by controller.
  run_id: bsm_pub_full_dist_base
  # CONFIGURE: shared Pixi env reachable from every compute node (Kestrel
  # publication run used /projects/bsm/.pixi).
  pixi_env_path: /projects/bsm/.pixi
  slurm:
    account: ira45y48e  # paid allocation (switched from bsm standby)
    partition: shared
    walltime: "04:00:00"
    memory_gb: 128
    cpus_per_task: 8
    reduce_partition: shared
    reduce_cpus_per_task: 8
    max_concurrent_array_tasks: 64
    # Overridden by controller.
    log_dir: "/scratch/${USER}/bsm/bsm_pub_full_dist_base/logs"
    requeue: false
    signal_seconds_before_timeout: 60
  kestrel:
    # CONFIGURE: cluster-specific roots and partition names. Replace
    # projects_root / pixi_cache_dir with your project filesystem,
    # dask_network_interface with your high-speed NIC (e.g. ``ib0``), and
    # partition names to match your scheduler config.
    projects_root: /projects/bsm
    pixi_cache_dir: /projects/bsm/.cache/pixi
    dask_network_interface: hsn0
    max_array_size: 11000
    debug_partition: debug
    gpu_partition: gpu-h100s
    production_partition: shared
  spill:
    # CONFIGURE: fast scratch path for Dask spilling.
    scratch_root: "/scratch/${USER}/bsm"
    tmpdir_spill_enabled: false
    min_free_gb: 20.0
    spill_chunk_size_mb: 256
