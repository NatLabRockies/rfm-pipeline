# Copy this file to configs/manuscript_paths.yml and set paths for your environment.
# configs/manuscript_paths.yml is gitignored — do not commit your local paths.
#
# Set each value below to the BSM files required for manuscript reproduction.
# Typical filenames are shown as examples.

case_study_input_matrix: /path/to/bsm/simulation/data/X.parquet
case_study_output_matrix: /path/to/bsm/simulation/data/Y.parquet
input_metadata: /path/to/bsm/simulation/data/all_input_metadata.parquet
output_metadata: /path/to/bsm/simulation/data/output_metadata.parquet
manuscript_feature_catalog: /path/to/bsm/simulation/data/manuscript_feature_catalog.parquet
fixed_holdout_assignments: /path/to/bsm/simulation/data/fixed_holdout_assignments.parquet

# Output directory is set by the HPC config (output.artifact_dir in
# configs/hpc/*.yml), not here. Override via env var SCRATCH_DIR or by
# editing the active HPC YAML.
