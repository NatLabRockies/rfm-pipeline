# Reproducibility runtime manifest for the manuscript pipeline.
#
# The historical workflow ran the manuscript pipeline as a chain of nine
# Jupyter notebooks. Those notebooks were retired during the 2025 reorg and
# replaced by the staged Python entry points under ``scripts/`` (which call
# back into the ``rfm_pipeline`` package). This manifest is retained as a
# documentation-only record of the manuscript stage ordering; no scripts
# currently load it (the canonical executable stage list lives in
# ``scripts/run_manuscript_pipeline.py`` ``STAGES`` and in
# ``scripts/kestrel/controller_publication_full_dataset_distributed.sh``).
#
# Each entry below names a manuscript stage and the corresponding section
# of the paper. The runner ``scripts/run_manuscript_pipeline.py`` is the
# orchestrator.

stages:
  - id: data_intake
    label: case study data intake and holdout split
    manuscript_section: "3.2 Case study data"
  - id: candidate_library
    label: candidate library construction
    manuscript_section: "3.3 Candidate library"
  - id: output_conditioning
    label: output variance/SNR filtering and PCA reduction
    manuscript_section: "3.4 Output conditioning"
  - id: empirical_null_screen
    label: permutation-null first-order screening
    manuscript_section: "3.5 Empirical-null screening"
  - id: interaction_discovery
    label: tree-SHAP interaction discovery
    manuscript_section: "3.6 Interaction discovery"
  - id: nonlinear_discovery
    label: GAM-based nonlinear transformation discovery
    manuscript_section: "3.5 Nonlinear discovery"
  - id: sparse_selection
    label: EBIC L1 sparse selection with subsample stability
    manuscript_section: "3.7 Sparse selection"
  - id: final_manuscript_artifacts
    label: final HC3 OLS fit, pruning, and reproducibility bundle export
    manuscript_section: "3.8 Final OLS"
  - id: manuscript_tables_and_figures
    label: manuscript table and figure regeneration
    manuscript_section: "5 Results"

orchestrator: scripts/run_manuscript_pipeline.py
artifact_root: artifacts/
local_path_override: configs/manuscript_paths.yml
