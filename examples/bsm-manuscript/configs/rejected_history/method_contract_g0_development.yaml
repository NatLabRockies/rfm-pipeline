screening:
  statistic: coefficient_row_l2_norm
  bh_q: 0.05
  permutation_count_B: 3199

interaction:
  selection_method: max_stat_adjusted_p_mc
  alpha: 0.05
  permutation_count_B: 999
  minimum_selection_draws: 999
  tie_convention: ">="
  candidate_pair_order: lexicographic_feature_name
  shared_response_row_schedule: true

calibration:
  one_sided_confidence: 0.95
  tolerance: 0.04
  gate_upper_bound: 0.09
  null_replicates_confirmatory: 1000
  operating_characteristic_rates: [0.05, 0.075, 0.09, 0.10]
  statement: passed_prespecified_empirical_calibration_tolerance_only

development:
  replicates_per_scenario: 2
  n_train: 160
  n_eval: 80
  n_outputs: 4
  retry_policy:
    max_attempts: 1
    retryable_statuses: []

dgp:
  continuous_distribution: uniform_published_range
  binary_distribution: balanced_four_cell
  coded_continuous_range: [-1.0, 1.0]
  binary_coding: [-1.0, 1.0]
  intercept: 0.25
  noise_base_sd: 0.20
  row_heteroscedasticity:
    driver_input_position: 0
    minimum_multiplier: 0.75
    maximum_multiplier: 1.50
    function: bounded_affine_absolute_coded_input
  correlated_block:
    size: 6
    latent_weight: 0.70
    noise_weight: 0.30
  strong_effect_floor: 0.75
  transform_library: [quadratic, logarithm, inverse, square_root]

nondegeneracy:
  minimum_pair_family_size: 2
  required_rate: 0.90
  global_null_empty_family_allowed: true
  fixed_family_sizes: [10, 100, 1000]

terminal_records:
  required_fields:
    - phase
    - scenario
    - replicate_index
    - attempt
    - status
    - terminal_outcome
    - terminal_stage
    - contract_sha256
    - control_snapshot_sha256
    - seed
    - schedule_sha256
    - screened_count
    - pair_family_count
    - truth_interaction_ids
    - retained_interaction_ids
    - false_pair_count
    - exception
    - runtime_seconds
    - max_rss_bytes
  empty_family_outcome: NO_INTERACTION_CANDIDATES
  completed_status: ANALYSIS_COMPLETE
  failed_status: FAILED
  failure_action: exit_nonzero

