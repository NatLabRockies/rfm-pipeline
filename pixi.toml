[workspace]
name = "bsm-rfm"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2"
pandas = ">=2"
pyarrow = ">=17"
scikit-learn = ">=1.5"
shap = ">=0.44"
pytest = ">=8"
ruff = ">=0.6"
mdformat = ">=0.7"
mdformat-gfm = ">=0.4"
nbformat = ">=5.10"
sphinx = ">=8"
myst-parser = ">=4"
jupyter = ">=1"
pyyaml = ">=6"
setuptools = ">=68"
wheel = ">=0.45"
pre-commit = ">=3.8"
jupyterlab = ">=4.5.7,<5"
pixi-kernel = ">=0.7.1,<0.8"

[pypi-dependencies]
build = ">=1.2"

[tasks]
import-smoke = "python tools/import_smoke.py"
build-import-smoke = 'python -c "import build; print(build.__file__)"'
clean-transients = "python tools/clean_transients.py"
repo-hygiene = "python tools/check_repo.py"
compile-check = "python tools/compile_check.py"
workflow-tests = "pytest -q tests/test_pipeline_smoke.py"
manuscript-reproduction-smoke = "python tools/check_manuscript_reproduction.py"
notebook-tests = "python tools/execute_notebooks.py --timeout 1200"
notebook-workflow-check = "python tools/check_notebook_stage_calls.py"
docs = "python tools/build_docs.py"
package-build = "python -m build --no-isolation --sdist --wheel"
git-diff-check = "git diff --check"
style-fix = "ruff check . --fix && ruff format . && python -m tools.format_markdown && python tools/notebook_hygiene.py fix"
style-check = "ruff check . && ruff format . --check && python -m tools.check_markdown && python tools/notebook_hygiene.py check"
test = "pytest -q"
compile = "python -m compileall src tests"
ci = "./test_repo.sh --ci"
gate = "./test_repo.sh --check"
gate-fix = "./test_repo.sh --fix"
gate-clean = "./test_repo.sh --clean"
hooks-install = "pre-commit install && pre-commit install --hook-type pre-push"
install-package = "python -m pip install -e ."

format-python = "ruff check . --fix && ruff format ."
format-markdown = "python -m tools.format_markdown"
fix-notebooks = "python tools/notebook_hygiene.py fix"
notebook-check = "python tools/notebook_hygiene.py check"
markdown-check = "python -m tools.check_markdown"
lint = "ruff check ."
format-check = "ruff format . --check"
unit-tests = "pytest -q"

# Manuscript reproduction workflows
manuscript-reproduce = "env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 python scripts/run_manuscript_reproduction.py"
manuscript-preprocess = "python scripts/preprocess_multiindex_data.py"
workflow-run = "python tools/run_tracked_workflow.py"
runtime-investigation = "python tools/run_runtime_investigation.py"
