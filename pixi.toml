[workspace]
name = "rfm-pipeline"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2"
pandas = ">=2"
pyarrow = ">=17"
scikit-learn = ">=1.5"
pytest = ">=8"
ruff = ">=0.6"
mdformat = ">=0.7"
mdformat-gfm = ">=0.4"
sphinx = ">=8"
myst-parser = ">=4"
sympy = ">=1.12"
setuptools = ">=68"
wheel = ">=0.45"
pre-commit = ">=3.8"

[pypi-dependencies]
build = ">=1.2"
rfm-pipeline = { path = ".", editable = true }

[tasks]
import-smoke = "python tools/import_smoke.py"
build-import-smoke = 'python -c "import build; print(build.__file__)"'
clean-transients = "python tools/clean_transients.py"
repo-hygiene = "python tools/check_repo.py"
compile-check = "python tools/compile_check.py"
workflow-tests = "python -m pytest -q tests/test_pipeline_smoke.py"
pre-push-tests = "python -m pytest -q"
docs = "python tools/build_docs.py"
package-build = "python -m build --no-isolation --sdist --wheel"
package-smoke = "python tools/check_wheel.py"
git-diff-check = "git diff --check"
style-fix = "ruff check . --fix && ruff format . && python -m tools.format_markdown"
style-check = "ruff check . && ruff format . --check && python -m tools.check_markdown"
test = "python -m pytest -q"
compile = "python -m compileall src tests"
ci = "python tools/run_repository_gate.py check"
gate = "python tools/run_repository_gate.py check"
gate-fast = "python tools/run_repository_gate.py fast"
gate-fix = "python tools/run_repository_gate.py fix"
gate-clean = "python tools/run_repository_gate.py clean"
hooks-install = "pre-commit install && pre-commit install --hook-type pre-push"
install-package = "python -m pip install -e ."
format-python = "ruff check . --fix && ruff format ."
format-markdown = "python -m tools.format_markdown"
markdown-check = "python -m tools.check_markdown"
lint = "ruff check ."
format-check = "ruff format . --check"
unit-tests = "python -m pytest -q"
