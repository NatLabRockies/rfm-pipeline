
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfm-pipeline"
version = "0.1.0"
description = "Regression-based reduced-form modeling pipeline for large-scale simulation surrogate workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dylan Hettinger", email = "dylan.hettinger@nlr.gov" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["reduced-form-model", "surrogate-model", "regression", "workflow", "simulation", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.2",
  "PyYAML>=6.0",
  "sympy>=1.12",
  "scipy>=1.10",
]

[project.scripts]
rfm-hpc-submit = "rfm_pipeline.hpc_submit:main"

[project.urls]
Homepage = "https://github.com/NatLabRockies/rfm-pipeline"
Repository = "https://github.com/NatLabRockies/rfm-pipeline"
Issues = "https://github.com/NatLabRockies/rfm-pipeline/issues"
Changelog = "https://github.com/NatLabRockies/rfm-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mdformat>=0.7",
  "mdformat-gfm>=0.4",
  "nbformat>=5.10",
  "sphinx>=8",
  "myst-parser>=4",
  "jupyter>=1",
  "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: marks tests as slow-running (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".git",
  ".pixi",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__MACOSX",
  "build",
  "dist",
  "docs/_build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"docs/conf.py" = ["D"]
"tools/**/*.py" = ["D"]

[tool.ruff.format]
docstring-code-format = true
