# Generic 10-node CPU-scaling fixture for rfm-pipeline tests.

dataset:
  type: "synthetic_300_sample"

algorithm:
  variance_threshold: 0.90

runtime:
  n_jobs: 4
  output_batch_size: null
  use_chunked_io: false

stages:
  empirical_null_screening:
    n_permutations: 11
    bh_q_threshold: 0.10
  interaction_discovery:
    n_permutations: 5
    n_tree_estimators: 10
    max_tree_depth: 3
    p_threshold: 0.05
  nonlinear_discovery:
    edf_threshold: 2.5
  sparse_selection:
    n_stability_subsamples: 3
    subsample_fraction: 1.0

output:
  artifact_dir: "./artifacts/cpu_scale_10_run"
  seed: 0
  verbose: false

distributed:
  enabled: true
  backend: slurm_array
  run_id: rfm_cpu_scale_10
  slurm:
    partition: shared
    account: ""
    walltime: "04:00:00"
    cpus_per_task: 4
    mem_per_cpu: "4G"
    max_concurrent_array_tasks: 10
    log_dir: "./logs/cpu_scale_10"
    requeue: false
    signal_seconds_before_timeout: 60

validation:
  fast_mode: false
